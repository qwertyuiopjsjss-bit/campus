<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>智慧校园</title>
<style>
  :root{
    --bg:#0d0d0f;
    --panel:#1c1c1e;
    --panel-2:#2c2c2e;
    --line:#2b2b2e;
    --text:#f2f2f5;
    --muted:#8e8e93;
    --muted-2:#636366;
    --blue:#0a66d0;
    --blue-tile:#1d5fb0;
    --danger:#ff3b30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#000;color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  }
  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}

  /* ---------- 屏幕切换 ---------- */
  .screen{display:none;min-height:100vh;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- 顶部栏 ---------- */
  .bar{
    height:46px;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:0 12px;flex:0 0 auto;position:relative;
    font-size:17px;font-weight:600;letter-spacing:.5px;
  }
  .bar .left,.bar .right{position:absolute;top:0;height:46px;display:flex;align-items:center;gap:14px}
  .bar .left{left:12px;font-size:22px;font-weight:400}
  .bar .right{right:12px;font-size:19px;color:#e9e9ee}
  .bar .ico{width:26px;height:26px;display:grid;place-items:center;cursor:pointer}
  .bar .ico:active{opacity:.5}

  /* ---------- 内容滚动区 ---------- */
  .body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
  .screen.tabbed .body{padding-bottom:74px}

  /* ---------- 搜索 ---------- */
  .search{margin:6px 0 12px;display:flex;align-items:center;gap:8px;color:var(--muted)}
  .search .lens{font-size:15px;transform:translateY(-1px)}
  .search span:last-child{font-size:15px}

  /* ---------- 卡片分组 ---------- */
  .group{padding:0 0 16px}
  .group h3{
    margin:0;padding:8px 14px;font-size:12.5px;font-weight:400;
    color:#6f6f76;letter-spacing:.3px;
  }
  .card{
    background:var(--panel);border-radius:10px;margin:0 12px;padding:16px 6px 18px;
    display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px;
  }
  .card.solo{grid-template-columns:repeat(4,1fr)}

  .app-icon{
    border:0;background:none;padding:0;color:inherit;font:inherit;
    display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  }
  .app-icon .tile{
    width:52px;height:52px;border-radius:13px;background:var(--blue-tile);
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45);
    transition:transform .12s ease,filter .12s ease;
  }
  .app-icon:active .tile{transform:scale(.92);filter:brightness(1.15)}
  .app-icon svg{width:28px;height:28px;fill:#fff}
  .app-icon .label{font-size:12.5px;line-height:1.25;text-align:center;color:#e6e6ea;max-width:80px}

  /* ---------- 底部 tab ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    max-width:430px;margin:0 auto;
    background:#141416;border-top:1px solid #232326;
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    border:0;background:none;color:#5f5f66;font:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;position:relative;
  }
  .tabbar button.on{color:#e9e9ee}
  .tabbar svg{width:23px;height:23px;fill:currentColor}
  .tabbar .dot{
    position:absolute;top:-2px;right:calc(50% - 20px);
    min-width:17px;height:17px;border-radius:9px;background:var(--danger);
    color:#fff;font-size:11px;line-height:17px;text-align:center;padding:0 4px;font-weight:600;
  }

  /* ---------- 图二：请假列表 ---------- */
  .notice{
    background:#3a3320;color:#ffd75e;font-size:13px;line-height:1.5;
    padding:10px 14px;
  }
  .notice b{color:inherit;font-weight:600}
  .notice a{color:#4da3ff;text-decoration:none}
  .list-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px;font-size:14px;color:#d8d8dd;
  }
  .list-head .add{
    border:0;background:none;color:#d8d8dd;font:inherit;font-size:14px;
    display:flex;align-items:center;gap:5px;cursor:pointer;
  }
  .list-head .add:active{opacity:.55}
  .list-head .add i{
    width:17px;height:17px;border-radius:50%;border:1.4px solid #9a9aa2;
    display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1;
  }
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 0}
  .empty p{color:#6b6b72;font-size:14px;margin:0}

  /* ---------- 图一：表单 ---------- */
  .form-title{padding:14px 14px 10px;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .form-title::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--blue)}
  .form{background:var(--panel);border-top:1px solid #242427;border-bottom:1px solid #242427}
  .row{
    display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;
    border-bottom:1px solid var(--line);font-size:15px;
  }
  .row:last-child{border-bottom:0}
  .row .k{flex:0 0 auto;color:#e9e9ee}
  .row .k em{color:var(--danger);font-style:normal;margin-right:2px}
  .row .v{margin-left:auto;color:var(--muted-2);display:flex;align-items:center;gap:6px}
  .row .v .chev{color:#5a5a60;font-size:15px;transform:scale(1.15) translateY(-1px)}
  .row.tap{cursor:pointer}
  .row.tap:active{background:#232326}
  .block{padding:12px 14px 14px;border-bottom:1px solid var(--line)}
  .block .k{color:#e9e9ee;font-size:15px;margin-bottom:10px;display:block}
  .block .k em{color:var(--danger);font-style:normal;margin-right:2px}
  textarea{
    width:100%;min-height:116px;resize:vertical;border:1px solid #333338;border-radius:6px;
    background:#242427;color:var(--text);font:inherit;font-size:14px;padding:10px 12px;outline:none;
  }
  textarea::placeholder{color:#5c5c63}
  textarea:focus{border-color:#0a66d0}
  .counter{text-align:right;color:#6f6f76;font-size:12.5px;margin-top:6px}

  .switch{
    width:50px;height:30px;border-radius:15px;background:#3a3a3e;position:relative;
    margin-left:auto;transition:background .18s;cursor:pointer;
  }
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
    background:#fff;transition:transform .18s;
  }
  .switch.on{background:#0a66d0}
  .switch.on::after{transform:translateX(20px)}

  .upload-ico{color:var(--blue);font-size:17px}
  .upload{color:var(--blue)}
  .files{padding:0 14px 14px;display:flex;flex-wrap:wrap;gap:10px}
  .files:empty{display:none}
  .file-chip{
    display:flex;align-items:center;gap:6px;background:#242427;border:1px solid #333338;
    border-radius:8px;padding:8px 10px;font-size:12.5px;color:#c9c9cf;max-width:100%;
  }
  .file-chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .file-chip span{color:var(--muted-2);cursor:pointer}

  .submit-wrap{padding:22px 14px 40px}
  .submit{
    width:100%;height:46px;border:0;border-radius:23px;background:var(--blue);
    color:#fff;font-size:16px;font-weight:500;cursor:pointer;
  }
  .submit:active{filter:brightness(.9)}

  /* ---------- 选择面板 ---------- */
  .sheet-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:flex-end;justify-content:center;z-index:40;
  }
  .sheet-mask.open{display:flex}
  .sheet{
    width:100%;max-width:430px;background:#1c1c1e;border-radius:14px 14px 0 0;
    padding:8px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .sheet h4{margin:0;padding:14px 18px 10px;font-size:14px;color:var(--muted);font-weight:400}
  .sheet button{
    width:100%;border:0;background:none;color:#e9e9ee;font:inherit;font-size:16px;
    padding:14px 18px;text-align:left;cursor:pointer;border-top:1px solid #262629;
  }
  .sheet button:active{background:#26262a}
  .sheet .cancel{color:var(--muted);text-align:center}
  .toast{
    position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);z-index:50;
    background:rgba(40,40,44,.96);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:18px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .err-bar{
    display:none;position:sticky;top:0;z-index:60;background:#5a1b18;color:#ffd7d3;
    font-size:12.5px;line-height:1.4;padding:8px 12px;word-break:break-all;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 图三：工作台 ============ -->
  <section class="screen tabbed active" id="screen-workbench">
    <div class="bar">
      <div class="left"><span class="ico" onclick="toast('返回')">‹</span></div>
      <div class="title">工作台</div>
      <div class="right"><span class="ico" onclick="toast('扫一扫')">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#e9e9ee" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3.5 12h17"/>
        </svg></span></div>
    </div>

    <div class="body">
      <div class="search" style="padding:8px 14px 0">
        <span class="lens">&#9906;</span><span>搜索</span>
      </div>

      <div class="group">
        <h3>常用应用</h3>
        <div class="card">
          <button type="button" class="app-icon" data-nav="leave-list" onclick="go('leave-list')">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-7 15.2C5 15.3 8.1 13.6 12 13.6s7 1.7 7 4.6v1.3H5v-1.3Z"/><path d="M17.2 4.4a1 1 0 0 1 1.4 0l3 3a1 1 0 0 1-.7 1.7h-1.3V11a1 1 0 1 1-2 0V9.1h-1.3a1 1 0 0 1-.7-1.7l1.6-1.6-.3-.3a1 1 0 0 1 0-1.4Z"/></svg>
            </span>
            <span class="label">学生请假</span>
          </button>

          <button class="app-icon" data-toast="校园报修：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="m14.7 2.3 7 7-2.1 2.1-1.4-1.4-6.3 6.3-1.4 4.2-4.2 1.4 1.4-4.2 6.3-6.3-1.4-1.4L14.7 2.3Zm-8 12.4-1 3 3-1-2-2Z"/></svg>
            </span>
            <span class="label">校园报修</span>
          </button>

          <button class="app-icon" data-toast="学工系统：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M12 3 1.8 8.4 12 13.8l8.4-4.4v5.8h1.8V8.4L12 3Z" opacity=".95"/><path d="M5.4 12.3v4.6c0 1.9 3 3.4 6.6 3.4s6.6-1.5 6.6-3.4v-4.6L12 15.9l-6.6-3.6Z"/></svg>
            </span>
            <span class="label">学工系统</span>
          </button>

          <button class="app-icon" data-toast="教务系统：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M4 4h16v3H4V4Zm0 5h10v11H4V9Zm12 0h4v5h-4V9Zm0 7h4v4h-4v-4Z"/></svg>
            </span>
            <span class="label">教务系统</span>
          </button>

          <button class="app-icon" data-toast="图书馆座位预约：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M3 5h7v15H3V5Zm9 0h9v15h-9V5Zm2 2v3h5V7h-5Zm0 5v3h5v-3h-5Z"/></svg>
            </span>
            <span class="label">图书馆座位预约</span>
          </button>

          <button class="app-icon" data-toast="图书借阅码：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H10v16H4.5A1.5 1.5 0 0 1 3 18.5v-13ZM11 4h8.5A1.5 1.5 0 0 1 21 5.5v13a1.5 1.5 0 0 1-1.5 1.5H11V4Zm2.5 3v1.6h3V7h-3Zm0 3v1.6h3V10h-3Z"/></svg>
            </span>
            <span class="label">图书借阅码</span>
          </button>
        </div>
      </div>

      <div class="group">
        <h3>行政办公</h3>
        <div class="card">
          <button class="app-icon" data-toast="微门户：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M12 2 2 8h20L12 2ZM4 10h3v9H4v-9Zm6.5 0h3v9h-3v-9ZM17 10h3v9h-3v-9ZM2 21h20v1.6H2V21Z"/></svg>
            </span>
            <span class="label">微门户</span>
          </button>
        </div>
      </div>

      <div class="group">
        <h3>个人中心</h3>
        <div class="card">
          <button class="app-icon" data-toast="我的借阅：暂无记录">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM8.5 12h7v1.6h-7V12Zm0 3.5h7V17h-7v-1.5Z"/></svg>
            </span>
            <span class="label">我的借阅</span>
          </button>

          <button class="app-icon" data-toast="修改统一认证密码：暂未开放">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M12 2 4 5.5V11c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5.5L12 2Zm0 5.5a2.6 2.6 0 0 1 1.4 4.8l.6 3.2h-4l.6-3.2A2.6 2.6 0 0 1 12 7.5Z"/></svg>
            </span>
            <span class="label">修改统一认证密码</span>
          </button>

          <button class="app-icon" data-toast="消息中心：暂无新消息">
            <span class="tile">
              <svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 1 6 6v3.6l1.8 3.2A1 1 0 0 1 18.9 16H5.1a1 1 0 0 1-.9-1.2L6 11.6V8a6 6 0 0 1 6-6Zm0 20a3 3 0 0 1-2.8-2h5.6A3 3 0 0 1 12 22Z"/></svg>
            </span>
            <span class="label">消息中心</span>
          </button>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <button class="on" data-toast="消息">
        <svg viewBox="0 0 24 24"><path d="M12 3c5 0 9 3.4 9 7.6S17 18.2 12 18.2c-.9 0-1.7-.1-2.5-.3L5 20.2l1.2-3.4A7.3 7.3 0 0 1 3 10.6C3 6.4 7 3 12 3Z"/></svg>
        <span>消息</span><i class="dot">2</i>
      </button>
      <button data-toast="文档"><svg viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6V2Zm7.5 1.4V8H18l-4.5-4.6Z"/></svg><span>文档</span></button>
      <button data-toast="通讯录"><svg viewBox="0 0 24 24"><path d="M9 4h11v2H9V4Zm0 5h11v2H9V9Zm0 5h11v2H9v-2ZM4 5.5a1.6 1.6 0 1 1 3.2 0 1.6 1.6 0 0 1-3.2 0Zm0 5a1.6 1.6 0 1 1 3.2 0 1.6 1.6 0 0 1-3.2 0Zm0 5a1.6 1.6 0 1 1 3.2 0 1.6 1.6 0 0 1-3.2 0Z"/></svg><span>通讯录</span></button>
      <button class="on" data-toast="工作台"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3Zm10 0h8v5h-8V3ZM3 13h8v8H3v-8Zm10-3h8v11h-8V10Z"/></svg><span>工作台</span></button>
      <button data-toast="我"><svg viewBox="0 0 24 24"><path d="M12 3a4.2 4.2 0 1 0 0 8.4A4.2 4.2 0 0 0 12 3Zm0 10.4c-4.3 0-7.8 2-7.8 4.6V21h15.6v-3c0-2.6-3.5-4.6-7.8-4.6Z"/></svg><span>我</span></button>
    </nav>
  </section>

  <!-- ============ 图二：请假列表 ============ -->
  <section class="screen" id="screen-leave-list">
    <div class="bar">
      <div class="left">
        <span class="ico" onclick="back()">‹</span>
        <span class="ico" onclick="back()">✕</span>
      </div>
      <div class="title">请假</div>
      <div class="right"><span class="ico" onclick="toast('更多')">···</span></div>
    </div>

    <div class="body">
      <div class="notice">
        学生请假分事假、病假、丧假、公假四种。（一）事假：指学生因本人或家庭特殊原因，无法参加正常…<a onclick="toast('查看详情')">详情</a>
      </div>

      <div class="list-head">
        <span>共 <b style="color:#4da3ff;font-weight:600">0</b> 条请假记录</span>
        <button type="button" class="add" data-nav="leave-new" onclick="go('leave-new')"><i>+</i>新增</button>
      </div>

      <div class="empty">
        <svg viewBox="0 0 120 78" width="120" height="78" aria-hidden="true">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4f4f6"/><stop offset="1" stop-color="#d9d9de"/>
            </linearGradient>
          </defs>
          <path d="M14 40 44 14h32l30 26-30 26H44L14 40Z" fill="url(#g1)" opacity=".95"/>
          <rect x="30" y="33" width="60" height="14" rx="7" fill="#c9c9d1"/>
          <rect x="41" y="36" width="38" height="8" rx="4" fill="#f7f7f9"/>
        </svg>
        <p>还没有请过假哦</p>
      </div>
    </div>
  </section>

  <!-- ============ 图一：请假表单 ============ -->
  <section class="screen tabbed" id="screen-leave-new">
    <div class="bar">
      <div class="left">
        <span class="ico" onclick="back()">‹</span>
        <span class="ico" onclick="back()">✕</span>
      </div>
      <div class="title">发起请假</div>
      <div class="right"><span class="ico" onclick="toast('更多')">···</span></div>
    </div>

    <div class="body">
      <div class="form-title">请假信息</div>

      <div class="form">
        <div class="row tap" data-picker="nature">
          <span class="k"><em>*</em>请假性质</span>
          <span class="v"><span data-slot="nature">请选择</span><span class="chev">›</span></span>
        </div>

        <div class="row tap" data-picker="type">
          <span class="k"><em>*</em>请假类型</span>
          <span class="v"><span data-slot="type">请选择</span><span class="chev">›</span></span>
        </div>

        <div class="row tap" data-picker="days">
          <span class="k"><em>*</em>请假天数</span>
          <span class="v"><span data-slot="days">请指定请假类型</span><span class="chev">›</span></span>
        </div>

        <div class="row">
          <span class="k"><em>*</em>是否出校</span>
          <span class="switch" id="outSwitch" role="switch" aria-checked="false"></span>
        </div>

        <div class="block">
          <span class="k"><em>*</em>请假事由</span>
          <textarea id="reason" maxlength="1000" placeholder="请输入请假事由"></textarea>
          <div class="counter"><span id="reasonCount">0</span>/1000</div>
        </div>

        <div class="row tap" onclick="pickFiles()">
          <span class="k">证明材料（<span id="fileCount">0</span>/3）</span>
          <span class="v"><span class="upload-ico">&#128206;</span><span class="upload">点击上传</span></span>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx" hidden>
      </div>

      <div class="files" id="fileList"></div>

      <div class="form" style="border-top:0">
        <div class="row">
          <span class="k"><em>*</em>手机号</span>
          <span class="v" style="flex:1">
            <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号"
              style="width:100%;border:0;background:none;color:#f2f2f5;font:inherit;text-align:right;outline:none">
          </span>
        </div>
      </div>

      <div class="submit-wrap">
        <button class="submit" onclick="submitLeave()">提交</button>
      </div>
    </div>
  </section>

  <!-- 选择面板 -->
  <div class="sheet-mask" id="sheetMask">
    <div class="sheet">
      <h4 id="sheetTitle">请选择</h4>
      <div id="sheetOptions"></div>
      <button class="cancel" onclick="closeSheet()">取消</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <noscript>
    <div style="position:fixed;inset:0;z-index:99;background:#0d0d0f;color:#ffd7d3;padding:24px;font-size:14px;line-height:1.7">
      这个页面的跳转是靠 JavaScript 实现的，但你的浏览器把 JS 关了（或者这个预览窗口不执行 JS）。<br>
      用 Safari / Chrome 直接打开这个 .html 文件就行，别用聊天软件的内置预览。
    </div>
  </noscript>
  <div class="err-bar" id="errBar"></div>
</div>

<script>
  /* ---------------- 屏幕栈 ---------------- */
  const stack = ['screen-workbench'];

  // 允许 data-nav 写 "leave-list" 或 "screen-leave-list"，统一补上前缀
  function screenId(name){
    return name.startsWith('screen-') ? name : 'screen-' + name;
  }

  function show(id){
    // 目标屏幕不存在就什么都不做——绝不先把当前屏幕藏了，否则就是一片黑
    if (!document.getElementById(id)) return false;
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    const el = document.getElementById(id);
    const body = el && el.querySelector('.body');
    if (body) body.scrollTop = 0;
    return true;
  }

  function go(name){
    const id = screenId(name);
    if (stack[stack.length - 1] === id) return;
    if (!show(id)) return;
    stack.push(id);
    history.pushState({ screen: id }, '');
  }

  function back(){
    if (stack.length <= 1) { toast('已经在首页了'); return; }
    history.back();
  }

  window.addEventListener('popstate', () => {
    if (stack.length > 1) { stack.pop(); show(stack[stack.length - 1]); }
  });

  /* ---------------- 事件绑定 ---------------- */
  function init(){
    document.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => go(el.dataset.nav));
    });
    document.querySelectorAll('[data-toast]').forEach(el => {
      el.addEventListener('click', () => toast(el.dataset.toast));
    });
    document.querySelectorAll('[data-picker]').forEach(row => {
      row.addEventListener('click', () => openSheet(row.dataset.picker));
    });
  }
  window.addEventListener('error', e => {
    const b = document.getElementById('errBar');
    b.style.display = 'block';
    b.textContent = '脚本报错：' + (e.message || e.type);
  });

  /* ---------------- 提示 ---------------- */
  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  /* ---------------- 下拉选择 ---------------- */
  const SELECTS = {
    nature: { title: '请假性质', options: ['事假', '病假'] },
    type:   { title: '请假类型', options: ['整天', '半天', '按节次'] },
    days:   { title: '请假天数', options: ['0.5 天', '1 天', '2 天', '3 天', '3 天以上'] }
  };
  let currentPicker = null;

  function openSheet(key){
    const cfg = SELECTS[key];
    if (!cfg) return;
    currentPicker = key;
    document.getElementById('sheetTitle').textContent = cfg.title;
    const box = document.getElementById('sheetOptions');
    box.innerHTML = '';
    cfg.options.forEach(opt => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.onclick = () => { choose(key, opt); };
      box.appendChild(b);
    });
    document.getElementById('sheetMask').classList.add('open');
  }
  function closeSheet(){
    document.getElementById('sheetMask').classList.remove('open');
    currentPicker = null;
  }
  document.getElementById('sheetMask').addEventListener('click', e => {
    if (e.target.id === 'sheetMask') closeSheet();
  });

  const chosen = {};
  function choose(key, value){
    chosen[key] = value;
    const slot = document.querySelector(`[data-slot="${key}"]`);
    slot.textContent = value;
    slot.parentElement.querySelector('.v').style.color = '#f2f2f5';
    if (key === 'type' && !chosen.days){
      const d = document.querySelector('[data-slot="days"]');
      d.textContent = '请选择';
    }
    closeSheet();
  }

  /* ---------------- 是否出校 ---------------- */
  const sw = document.getElementById('outSwitch');
  sw.addEventListener('click', () => {
    const on = sw.classList.toggle('on');
    sw.setAttribute('aria-checked', String(on));
  });

  /* ---------------- 字数统计 ---------------- */
  const reason = document.getElementById('reason');
  const reasonCount = document.getElementById('reasonCount');
  reason.addEventListener('input', () => { reasonCount.textContent = reason.value.length; });

  /* ---------------- 上传 ---------------- */
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  let files = [];

  function pickFiles(){ fileInput.click(); }

  fileInput.addEventListener('change', () => {
    const picked = Array.from(fileInput.files || []);
    for (const f of picked){
      if (files.length >= 3) { toast('最多上传 3 个文件'); break; }
      files.push(f);
    }
    fileInput.value = '';
    renderFiles();
  });

  function renderFiles(){
    document.getElementById('fileCount').textContent = files.length;
    fileList.innerHTML = '';
    files.forEach((f, i) => {
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.innerHTML = `<span>&#128206;</span><b></b><span data-del="${i}">✕</span>`;
      chip.querySelector('b').textContent = f.name;
      fileList.appendChild(chip);
    });
  }
  fileList.addEventListener('click', e => {
    const i = e.target.dataset.del;
    if (i === undefined) return;
    files.splice(Number(i), 1);
    renderFiles();
  });

  /* ---------------- 提交 ---------------- */
  function submitLeave(){
    if (!chosen.nature) return toast('请选择请假性质');
    if (!chosen.type) return toast('请选择请假类型');
    if (!chosen.days) return toast('请指定请假天数');
    if (!reason.value.trim()) return toast('请输入请假事由');
    const phone = document.getElementById('phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的手机号');

    toast(`提交成功：${chosen.nature} ${chosen.days}（${document.getElementById('outSwitch').classList.contains('on') ? '出校' : '不出校'}）`);
    const done = document.getElementById('screen-leave-new');
    setTimeout(() => { back(); }, 900);
  }

  show('screen-workbench');
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
</html>
